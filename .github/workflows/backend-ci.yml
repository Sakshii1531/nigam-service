name: Backend CI

# Phase 12 exit criterion (partial — the "auto-deploys to Render" half needs a
# real Render account connected by the user; see backend/docs/DEPLOYMENT.md).
# Runs lint + the full Jest suite + the Playwright E2E suite (API-only, no
# browser binaries needed) on every PR and on push to main. Jest is sharded so
# each runner has an isolated MongoDB replica set and a bounded workload.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'e2e/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'e2e/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: 'backend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB replica set
        run: |
          docker run --detach --name mongodb --publish 27017:27017 \
            mongo:6 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec mongodb mongosh --quiet --eval \
              'db.adminCommand({ ping: 1 }).ok' | grep -q '^1$'; then
              break
            fi
            sleep 1
          done
          docker exec mongodb mongosh --quiet --eval \
            'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for attempt in {1..30}; do
            if docker exec mongodb mongosh --quiet --eval \
              'db.hello().isWritablePrimary' | grep -q '^true$'; then
              exit 0
            fi
            sleep 1
          done
          docker logs mongodb
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: 'backend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Jest — unit + integration tests (shard ${{ matrix.shard }}/4)
        working-directory: backend
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/nigam_care_test?replicaSet=rs0
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test -- --shard=${{ matrix.shard }}/4 --forceExit

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB replica set
        run: |
          docker run --detach --name mongodb --publish 27017:27017 \
            mongo:6 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec mongodb mongosh --quiet --eval \
              'db.adminCommand({ ping: 1 }).ok' | grep -q '^1$'; then
              break
            fi
            sleep 1
          done
          docker exec mongodb mongosh --quiet --eval \
            'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for attempt in {1..30}; do
            if docker exec mongodb mongosh --quiet --eval \
              'db.hello().isWritablePrimary' | grep -q '^true$'; then
              exit 0
            fi
            sleep 1
          done
          docker logs mongodb
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: 'backend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Playwright E2E — real running server, API-only (no browser binaries needed)
        working-directory: e2e
        env:
          CI: true
          E2E_MONGODB_URI: mongodb://127.0.0.1:27017/nigam_care_e2e?replicaSet=rs0
        run: npx playwright test
