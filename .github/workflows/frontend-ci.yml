name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'e2e/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'e2e/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx eslint . --quiet

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  workspace-browser-checks:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Ticket workspace and document preview regressions
        run: npx playwright test --config=playwright.workspace.config.js --workers=1
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-browser-failures
          path: e2e/test-results/
          retention-days: 7

  customer-service-flows:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v5
      - name: Start MongoDB replica set
        run: |
          docker run --detach --name mongodb --publish 27017:27017 \
            mongo:7.0 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec mongodb mongosh --quiet --eval \
              'db.adminCommand({ ping: 1 }).ok' | grep -q '^1$'; then
              break
            fi
            sleep 1
          done
          docker exec mongodb mongosh --quiet --eval \
            'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for attempt in {1..30}; do
            if docker exec mongodb mongosh --quiet --eval \
              'db.hello().isWritablePrimary' | grep -q '^true$'; then
              exit 0
            fi
            sleep 1
          done
          docker logs mongodb
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version-file: 'backend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Appliance management, business booking and GST invoice
        working-directory: e2e
        env:
          CI: true
          NODE_ENV: test
          OTP_PROVIDER: test
          E2E_MONGODB_URI: mongodb://127.0.0.1:27017/nigam_gst_invoice_e2e?replicaSet=rs0
        run: npx playwright test --config=playwright.ui.config.js customerGstInvoice.spec.js myAppliances.spec.js --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: customer-service-flow-failures
          path: e2e/test-results/
          retention-days: 7
