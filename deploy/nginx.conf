# Phase 14 — VPS migration artifact. Reverse proxy + TLS termination in front
# of the API container (deploy/docker-compose.yml binds it to 127.0.0.1:4000
# only — this is the sole public entry point). Replace api.example.com with
# the real domain once DNS is cut over (see VPS_MIGRATION.md).
#
# Cert paths match Certbot's default layout after
# `certbot --nginx -d api.example.com` — that command also rewrites this
# file's TLS block in place, so what's checked in here is the pre-certbot
# starting point, not a promise the paths already exist on a fresh VPS.

server {
    listen 80;
    server_name api.example.com;

    # Certbot's HTTP-01 challenge needs to reach this path over plain HTTP
    # before a cert exists — everything else redirects straight to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5m; # matches express.json({ limit: '2mb' }) with headroom for multipart uploads

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Socket.IO (Phase 9's real-time layer) — a plain HTTP
        # reverse proxy without these two headers silently breaks the
        # WebSocket upgrade and Socket.IO falls back to (much slower) long-polling.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
