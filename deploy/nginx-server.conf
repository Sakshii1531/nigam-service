# Nigam Care — the single live site config (HTTPS + HTTP->HTTPS redirect).
# Merged 2026-11-13: the separate nigamcare.conf carried the upload limit,
# /uploads/ proxy and asset caching, but its server block was shadowed by this
# one ("conflicting server name ... ignored"), so live traffic never got them.

server {
    server_name nigamcarecompany.in www.nigamcarecompany.in nigamcarecompany.com www.nigamcarecompany.com;

    root /var/www/nigamcare;
    index index.html;

    # Photos, invoices and documents are uploaded through the API (default was 1 MB).
    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Files the backend stores locally (served by Express from /uploads).
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built assets have content hashes in their names, so they can be cached long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # SPA routing; index.html itself must never be cached or users keep old builds.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nigamcarecompany.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nigamcarecompany.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name nigamcarecompany.in www.nigamcarecompany.in nigamcarecompany.com www.nigamcarecompany.com;

    # Let's Encrypt HTTP challenges (certificate renewal).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
